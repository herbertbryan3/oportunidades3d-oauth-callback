<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Autorização do Mercado Livre</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #242424;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
    }
    main {
      width: min(620px, 100%);
      padding: 32px;
      border: 1px solid #e2e2e2;
      border-radius: 16px;
      background: white;
      box-shadow: 0 12px 35px rgb(0 0 0 / 8%);
    }
    h1 { margin-top: 0; font-size: 1.55rem; }
    p { line-height: 1.55; }
    .status {
      padding: 14px 16px;
      border-radius: 10px;
      background: #eef7ee;
      color: #176b24;
      font-weight: 650;
    }
    .status.error {
      background: #fff0f0;
      color: #9b1c1c;
    }
    code {
      display: block;
      overflow-wrap: anywhere;
      margin: 18px 0;
      padding: 14px;
      border-radius: 8px;
      background: #f2f2f2;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      background: #3483fa;
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
    small { display: block; margin-top: 18px; color: #666; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1>Autorização do Mercado Livre</h1>
    <p id="status" class="status">Verificando o retorno da autorização…</p>
    <code id="authorization-code" hidden></code>
    <button id="copy-button" type="button" disabled>Copiar código temporário</button>
    <small>
      O código é temporário e só pode ser usado uma vez. Não envie este código,
      o Client Secret ou os tokens por mensagens. Esta página não transmite nem armazena o código.
    </small>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const error = params.get("error");
      const errorDescription = params.get("error_description");
      const status = document.querySelector("#status");
      const codeElement = document.querySelector("#authorization-code");
      const copyButton = document.querySelector("#copy-button");

      // Retira os parâmetros sensíveis da barra de endereço sem recarregar a página.
      if (window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      if (code) {
        status.textContent = "Autorização concluída. Copie o código para o coletor local.";
        codeElement.textContent = code;
        codeElement.hidden = false;
        copyButton.disabled = false;
        copyButton.addEventListener("click", async () => {
          await navigator.clipboard.writeText(code);
          copyButton.textContent = "Código copiado";
        });
        return;
      }

      status.classList.add("error");
      if (error) {
        status.textContent = `A autorização não foi concluída: ${errorDescription || error}`;
      } else {
        status.textContent = "Nenhum código foi recebido. Inicie a autorização pelo coletor.";
      }
    })();
  </script>
</body>
</html>
